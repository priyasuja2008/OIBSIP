<!DOCTYPE html>
<html>

<head>

    <title>Iris Flower Classification</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>Iris Flower Classification</h1>

<form action="/predict" method="post">

<input type="number"
step="0.1"
name="sl"
placeholder="Sepal Length"
required>

<input type="number"
step="0.1"
name="sw"
placeholder="Sepal Width"
required>

<input type="number"
step="0.1"
name="pl"
placeholder="Petal Length"
required>

<input type="number"
step="0.1"
name="pw"
placeholder="Petal Width"
required>

<button type="submit">
Predict
</button>

</form>

{% if prediction %}

<div class="result">

Predicted Flower:

<h2>{{ prediction }}</h2>

</div>

{% endif %}

</div>

</body>

</html>
